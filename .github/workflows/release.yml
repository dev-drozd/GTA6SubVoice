name: Сборка релиза (Windows x64)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например, v1.0.0; если пусто — берётся из src/version.py)"
        required: false
        default: ""

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build-and-release:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Resolve release tag
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}".Trim()
          if (-not $tag -and "${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}".Trim()
          }
          if (-not $tag) {
            $ver = python -c "from src.version import APP_VERSION; print(APP_VERSION)"
            $tag = "v$($ver.Trim())"
          }
          if (-not $tag.StartsWith("v")) {
            $tag = "v$tag"
          }
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag: $tag"

      - name: Create .venv and install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download & verify Silero v5.6 and RapidOCR models
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m src.dependency_manager --download-all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build portable package
        shell: pwsh
        run: |
          cmd /c build.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify build (--smoke-test & --check-ui-modes)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\dist\GTA6SubVoice\GTA6SubVoice.exe" `
            -ArgumentList "--smoke-test", "--smoke-out", "$PWD\smoke.json" `
            -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) {
            Write-Error "Smoke-test exited with code $($p.ExitCode)"
            exit $p.ExitCode
          }
          Get-Content "$PWD\smoke.json"

          $pUi = Start-Process -FilePath ".\dist\GTA6SubVoice\GTA6SubVoice.exe" `
            -ArgumentList "--check-ui-modes", "--smoke-out", "$PWD\smoke_ui.json" `
            -Wait -PassThru -NoNewWindow
          if ($pUi.ExitCode -ne 0) {
            Write-Error "UI check exited with code $($pUi.ExitCode)"
            exit $pUi.ExitCode
          }
          Get-Content "$PWD\smoke_ui.json"

      - name: Package release ZIP archive & SHA-256 checksum
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force -Path "release_artifacts" | Out-Null

          Push-Location "dist"
          7z a -tzip -mx=5 "..\release_artifacts\GTA6SubVoice-$env:RELEASE_TAG-win64.zip" "GTA6SubVoice"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

          Push-Location "release_artifacts"
          $hashes = Get-FileHash -Algorithm SHA256 *.zip | ForEach-Object {
            "$($_.Hash.ToLower())  $((Split-Path $_.Path -Leaf))"
          }
          $hashes | Out-File -FilePath "SHA256SUMS.txt" -Encoding utf8
          Get-Content "SHA256SUMS.txt"
          Get-ChildItem | Select-Object Name, Length
          Pop-Location

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          $notesLines = @(
            '## GTA6SubVoice {TAG} (Windows x64)',
            '',
            'Автономная портативная сборка — скачайте **`GTA6SubVoice-{TAG}-win64.zip`**, распакуйте архив и запустите `GTA6SubVoice.exe` (все модели Silero v5.6 и RapidOCR уже включены).',
            '',
            '### Минимальные требования',
            '- Windows 10 (1903+) / Windows 11 (64-bit)',
            '- Процессор от 4 потоков с поддержкой AVX2',
            '- От 8 ГБ ОЗУ'
          )
          $notesFile = Join-Path $PWD "release_notes.md"
          (($notesLines -join "`n").Replace('{TAG}', $tag)) | Out-File -FilePath $notesFile -Encoding utf8

          $files = @(Get-ChildItem -Path "release_artifacts" -File | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) {
            Write-Error "::error::No release artifacts found to publish!"
            exit 1
          }

          gh release view "$tag" *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)

          if (-not $releaseExists) {
            gh release create "$tag" --target "$env:GITHUB_SHA" --title "GTA6SubVoice $tag" --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::gh release create failed for $tag"
              exit $LASTEXITCODE
            }
          } else {
            $oldAssets = @(gh release view "$tag" --json assets --jq ".assets[].name" 2>$null)
            foreach ($assetName in $oldAssets) {
              $cleanName = "$assetName".Trim()
              if ($cleanName) {
                gh release delete-asset "$tag" "$cleanName" --yes
              }
            }
            gh release edit "$tag" --title "GTA6SubVoice $tag" --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::gh release edit failed for $tag"
              exit $LASTEXITCODE
            }
          }

          $uploaded = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Uploading release assets (attempt $attempt/3)..."
            gh release upload "$tag" @files --clobber
            if ($LASTEXITCODE -eq 0) {
              $uploaded = $true
              break
            }
            Start-Sleep -Seconds (5 * $attempt)
          }
          if (-not $uploaded) {
            Write-Host "::error::Failed to upload release assets after 3 attempts"
            exit 1
          }
